[package]
name = "voice-assistant"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
cpal = "0.15"
hound = "3.5"
log = "0.4"
env_logger = "0.10"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
crossterm = "0.27"


# Local dependencies
wakeword-engine = { path = "../wakeword-engine" }
llama-cpp-4 = { version = "0.3.0", features = ["mtmd", "vulkan"] }

[profile.release]
lto = "thin"
codegen-units = 1
