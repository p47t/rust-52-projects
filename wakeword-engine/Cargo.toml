[package]
name = "wakeword-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
cpal = "0.15"
hound = "3.5"
log = "0.4"
env_logger = "0.10"
indicatif = "0.17"
tokio = { version = "1", features = ["full"] }
chrono = "0.4"

# WebRTC APM in pure Rust
sonora = "0.1.0"

# openWakeWord in Rust
oww-rs = "0.3"

[dev-dependencies]
rand = "0.8"
